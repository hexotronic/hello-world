name: Lauscher APK

on:
  push:
    paths:
      - "hoerbuch-player/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "hoerbuch-player/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lauscher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoerbuch-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional release key
        env:
          KEYSTORE_BASE64: ${{ secrets.LAUSCHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "LAUSCHER_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        env:
          LAUSCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUSCHER_KEYSTORE_PASSWORD }}
          LAUSCHER_KEY_ALIAS: ${{ secrets.LAUSCHER_KEY_ALIAS }}
          LAUSCHER_KEY_PASSWORD: ${{ secrets.LAUSCHER_KEY_PASSWORD }}
        run: |
          # Empty secrets must not override the defaults in build.gradle.kts.
          [ -z "$LAUSCHER_KEYSTORE_PASSWORD" ] && unset LAUSCHER_KEYSTORE_PASSWORD
          [ -z "$LAUSCHER_KEY_ALIAS" ] && unset LAUSCHER_KEY_ALIAS
          [ -z "$LAUSCHER_KEY_PASSWORD" ] && unset LAUSCHER_KEY_PASSWORD
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Lauscher-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lauscher-APK
          path: ${{ runner.temp }}/Lauscher-*.apk

      - name: Publish as release "Lauscher (neuester Build)"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/Lauscher-${GITHUB_RUN_NUMBER}.apk"
          TAG="lauscher-latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Lauscher – neuester Build (${GITHUB_REF_NAME})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. APK auf dem Handy herunterladen und installieren." \
            --prerelease

  device-test:
    name: Emulator-Test & Screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lauscher-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-screens.sh "$(ls apk/*.apk | head -1)" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lauscher-Screenshots
          path: screenshots

      - name: Attach screenshots to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lauscher-latest-${GITHUB_REF_NAME//\//-}"
          gh release upload "$TAG" screenshots/*.png --clobber
