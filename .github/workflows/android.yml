name: Android-APK bauen

on:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signaturschlüssel: aus dem Secret FLORAKARTEN_KEYSTORE (Base64) – damit bleiben Updates installierbar.
      # Ohne Secret wird der Debug-Schlüssel des Runners zwischengespeichert und wiederverwendet.
      - name: Signaturschlüssel aus Secret
        env:
          KEYSTORE_B64: ${{ secrets.FLORAKARTEN_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/florakarten.keystore"
            echo "FLORA_KEYSTORE=$RUNNER_TEMP/florakarten.keystore" >> "$GITHUB_ENV"
            echo "Signiere mit dem Schlüssel aus dem Secret."
          else
            echo "Kein Secret FLORAKARTEN_KEYSTORE gesetzt – nutze zwischengespeicherten Debug-Schlüssel."
          fi

      - name: Debug-Schlüssel zwischenspeichern (falls kein Secret)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: florakarten-debug-keystore-v1

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App ins Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk florakarten.apk

      - uses: actions/upload-artifact@v4
        with:
          name: florakarten-apk
          path: florakarten.apk
          retention-days: 30
