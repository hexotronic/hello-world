name: Android-APK bauen

on:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signaturschlüssel: Damit neue APKs als Update über die installierte App gehen, muss jeder Build
      # mit DEMSELBEN Schlüssel signieren. Der Schlüssel liegt als Base64-Text im Secret FLORAKARTEN_KEYSTORE
      # (Settings → Secrets and variables → Actions) und nie im Repository.
      # Ohne Secret: Notlösung mit einem im Build-Zwischenspeicher abgelegten Schlüssel (verfällt nach 7 Tagen ohne Build).
      - name: Notfall-Schlüssel aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.florakarten-key
          key: florakarten-fallback-keystore-v2

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.FLORAKARTEN_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/florakarten.keystore"
            KS="$RUNNER_TEMP/florakarten.keystore"
            echo "Signiere mit dem Schlüssel aus dem Secret FLORAKARTEN_KEYSTORE."
          else
            KS="$HOME/.florakarten-key/fallback.keystore"
            if [ ! -f "$KS" ]; then
              mkdir -p "$(dirname "$KS")"
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Florakarten,O=Privat,C=DE"
              echo "::warning::Kein Secret FLORAKARTEN_KEYSTORE – neuer Notfall-Schlüssel erzeugt. Diese APK lässt sich nicht als Update über Versionen mit anderem Schlüssel installieren."
            fi
          fi
          echo "FLORA_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "Zertifikat (SHA-256):"
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | grep -m1 "SHA256:"

      - name: Abhängigkeiten installieren
        run: npm ci

      # KI-Laufzeit für die Steckbrief-Auswertung direkt in die App legen (lokal statt vom CDN laden).
      # Die Dateien liegen nicht im Repository: transformers.min.js enthält eine Zeichenkette, die der
      # Geheimnis-Scanner von GitHub fälschlich für einen API-Schlüssel hält.
      - name: KI-Laufzeit (Transformers.js + ONNX Runtime Web) bereitstellen
        run: |
          T="$RUNNER_TEMP/tjs"; D="$GITHUB_WORKSPACE/www/vendor/transformers"
          mkdir -p "$T" "$D"
          ORT=$(npm view @huggingface/transformers@4.3.2 dependencies.onnxruntime-web)
          echo "onnxruntime-web $ORT"
          (cd "$T" && npm pack --silent @huggingface/transformers@4.3.2 "onnxruntime-web@$ORT" >/dev/null \
            && mkdir t o && tar xzf huggingface-transformers-4.3.2.tgz -C t && tar xzf onnxruntime-web-*.tgz -C o)
          cp "$T/t/package/dist/transformers.min.js" "$D/"
          cp "$T/t/package/LICENSE" "$D/LICENSE-transformers.txt"
          for f in ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm ort-wasm-simd-threaded.asyncify.mjs ort-wasm-simd-threaded.asyncify.wasm; do
            cp "$T/o/package/dist/$f" "$D/"
          done
          ls -la "$D"

      - name: Web-App ins Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk florakarten.apk

      - uses: actions/upload-artifact@v4
        with:
          name: florakarten-apk
          path: florakarten.apk
          retention-days: 30
