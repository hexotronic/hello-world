name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      # Starts a dedicated server with the mod, which loads every data file (registries, recipes, tags, loot,
      # data maps, world generation) and runs the in-game tests in data/thaumicunity/test_instance.
      - name: Game tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
      - name: Game test problems
        if: failure()
        run: grep -nE "ERROR|WARN.*thaumicunity|Exception|failed|FAILED|Couldn't|Failed to" gametest.log | grep -v "DEBUG" | head -n 200 || true

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thaumicunity-jar
          path: build/libs/*.jar
          retention-days: 14
