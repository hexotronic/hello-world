name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      # Starts a dedicated server with the mod, which loads every data file (registries, recipes, tags, loot,
      # data maps, world generation) and runs the in-game tests in data/thaumicunity/test_instance.
      - name: Game tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
      - name: Game test problems
        if: failure()
        run: grep -nE "ERROR|WARN.*thaumicunity|Exception|failed|FAILED|Couldn't|Failed to" gametest.log | grep -v "DEBUG" | head -n 200 || true

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thaumicunity-jar
          path: build/libs/*.jar
          retention-days: 14

  # Starts the real client under a virtual display with software rendering and runs the scripted tour in
  # ClientSmokeTest: test world, every device, every screen. Screenshots are uploaded as an artifact and also printed
  # as base64 at the end of the log (decode with tools/ci/decode_screenshots.py).
  client-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers python3-pil
          xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true

      - name: Client smoke test
        timeout-minutes: 25
        run: |
          mkdir -p run/smoke
          printf '%s\n' onboardAccessibility:false pauseOnLostFocus:false renderDistance:6 simulationDistance:5 \
            guiScale:2 tutorialStep:none joinedFirstServer:true skipMultiplayerWarning:true narrator:0 \
            soundCategory_master:0.0 > run/smoke/options.txt
          # A stand-in "Thaumcraft jar" (generated checkerboards, no Thaumcraft file) exercises the texture loader.
          mkdir -p run/smoke/thaumicunity
          python3 tools/ci/make_fake_thaumcraft_jar.py run/smoke/thaumicunity/fake-thaumcraft.jar
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runSmokeClient --stacktrace 2>&1 | tee smoke.log
          grep "Using Thaumcraft textures from fake-thaumcraft.jar" smoke.log
          ls run/smoke/thaumicunity/thaumcraft-pack/assets/thaumicunity/textures/*/

      - name: Smoke test report
        if: always()
        run: |
          cat run/smoke/smoke-report.txt || { echo "no report: the client did not finish the tour"; exit 1; }
          grep -q "RESULT ok" run/smoke/smoke-report.txt

      - name: Client problems
        if: always()
        run: grep -nE "ERROR|Exception|issing texture|Unable to|Failed to|FAIL|\[smoke\]" smoke.log | grep -v "DEBUG" | head -n 300 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: |
            run/smoke/screenshots/
            run/smoke/smoke-report.txt
            run/smoke/logs/latest.log
          retention-days: 14

      - name: Print screenshots
        if: always()
        run: python3 tools/ci/print_screenshots.py run/smoke/screenshots
