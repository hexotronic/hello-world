name: FluxPlayer APK

on:
  push:
    paths:
      - "FluxPlayer/**"
      - ".github/workflows/fluxplayer-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FluxPlayer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK (API 37.2) installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: FluxPlayer-apk
          path: FluxPlayer/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
