# Publishes a GitHub release with the mod jar. Runs only when started by hand (Actions > Release > Run workflow):
# builds and tests the commit, then creates the tag v<mod_version> and a pre-release with the jar attached.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (Markdown)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          {
            echo "Thaumic Unity ${version} for Minecraft $(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
            echo "with NeoForge $(grep '^neo_version=' gradle.properties | cut -d= -f2) or newer."
            echo
            echo "Put the jar in .minecraft/mods. Alpha: back up your worlds."
            echo
            echo "${NOTES}"
          } > notes.md
          gh release create "v${version}" "${jar}" --target "${GITHUB_SHA}" --title "Thaumic Unity ${version}" \
            --notes-file notes.md --prerelease
