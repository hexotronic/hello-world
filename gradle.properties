# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# Latest stable Minecraft release as of 2026-10-13 is Java Edition 26.3 ("Wilderness Bound", 2026-09-15).
# NeoForge for 26.3 is still flagged beta; 26.3.0.69-beta is the version pinned by the official MDK template.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.69-beta
neo_version_range=[26.3.0.69-beta,)

## Mod Properties
# License is the MDK default until the project owner picks one (see README "License").
mod_id=thaumicunity
mod_name=Thaumic Unity
mod_license=All Rights Reserved
mod_version=0.1.0-alpha
mod_group_id=dev.thaumicunity
mod_authors=hexotronic and contributors
mod_description=A unified arcane research mod: aspects, vis and aura, alchemy, infusion, golems and a fully data-driven spell-crafting system. An independent, original reimagining inspired by the Thaumcraft family of mods.
