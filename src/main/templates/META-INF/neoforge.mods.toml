license="${mod_license}"
issueTrackerURL="https://github.com/hexotronic/hello-world/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/hexotronic/hello-world"
bannerFile="thaumicunity_logo.png"
credits="Inspired by Azanor's Thaumcraft and the many addon authors of its ecosystem. All code and art in this mod are original."
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Every integration is optional: Thaumic Unity never requires another mod.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
