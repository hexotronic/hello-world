<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidGrab</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="../../icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>VidGrab</h1>
        <p id="page" class="muted ellipsis"></p>
      </div>
    </div>
    <div class="actions">
      <button id="rescan" class="icon-btn" type="button" title="Seite neu durchsuchen" aria-label="Seite neu durchsuchen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="clear" class="icon-btn" type="button" title="Liste leeren" aria-label="Liste leeren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      </button>
      <button id="settings" class="icon-btn" type="button" title="Einstellungen" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>

  <section id="empty" class="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3z"/></svg>
    <h2>Noch kein Video gefunden</h2>
    <p>Starte das Video auf der Seite (kurz abspielen genügt) und öffne VidGrab dann erneut.</p>
    <button id="rescan2" class="btn" type="button">Seite neu durchsuchen</button>
  </section>

  <p id="hidden-note" class="note" hidden>
    <span id="hidden-text"></span>
    <button id="toggle-hidden" class="link" type="button"></button>
  </p>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../common/media.js"></script>
  <script src="../ui/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
